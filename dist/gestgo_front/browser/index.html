<body class="theme-ocean-blue" style="background-color: var(--c-bg); color: var(--c-text)">
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('gestgo_theme') || 'ocean-blue';
        if (theme === 'zion-blue') theme = 'gestgo-blue';
        Array.from(document.body.classList).filter(function(c){ return c.startsWith('theme-'); }).forEach(function(c){ document.body.classList.remove(c); });
        document.body.classList.add('theme-' + theme);
        if (localStorage.getItem('gestgo_dark_mode') === '1') document.body.classList.add('dark');
        if (localStorage.getItem('gestgo_sidebar_collapsed') === '1') document.body.classList.add('sidebar-collapsed');
        var shell = localStorage.getItem('gestgo_shell_preset') || 'default';
        if (shell === 'tinted') document.body.classList.add('shell-preset-tinted');
        else if (shell === 'sidebar_dark') document.body.classList.add('shell-preset-sidebar-dark');
        var nav = localStorage.getItem('gestgo_nav_layout') || 'sidebar';
        if (nav === 'horizontal') document.body.classList.add('shell-nav-horizontal');

        /* Accent Nord + favicon + theme-color no boot (antes do Angular) */
        var primary = getComputedStyle(document.body).getPropertyValue('--c-primary').trim() || '#14B87A';
        var root = document.documentElement;
        root.style.setProperty('--n-color-accent', primary);
        root.style.setProperty('--n-color-accent-secondary', primary);
