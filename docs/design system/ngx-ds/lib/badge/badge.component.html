<ng-container [ngSwitch]="variant">
    <ng-container *ngSwitchCase="'dot'">
        <ng-container *ngTemplateOutlet="dotVariantTemplate"></ng-container>
    </ng-container>
    <ng-container *ngSwitchDefault>
        <ng-container *ngTemplateOutlet="defaultVariantTemplate"></ng-container>
    </ng-container>
</ng-container>

<ng-template #dotVariantTemplate>
</ng-template>

<ng-template #defaultVariantTemplate>
    <ng-content></ng-content>
</ng-template>
