<div class="relative" (mouseenter)="show = true" (mouseleave)="show = false">
	<ng-content></ng-content>
	<div *ngIf="show" class="absolute left-20 transform -translate-x-1/2 mt-2 w-60 p-0 bg-gray-500 text-white rounded shadow-lg z-40">
		<div class="bg-gray-600 max-w-full">
			<h3 class="text-lg font-bold">{{ title }}</h3>
		</div>
		<p>{{ content }}</p>
	</div>
</div>
