<upx-modal [disableFullSizeMobile]="true" [disableOrderMobile]="true" size="sm">
    <upx-modal-content>
        <h3 *ngIf="title">
            {{title}}
        </h3>
        <p *ngIf="message">
            {{message}}
        </p>
    </upx-modal-content>
    <upx-modal-footer>
        <upx-button *ngIf="button2 !== ''" (onClick)="close(false)">
            {{button2}}
        </upx-button>
        <upx-button *ngIf="isTheme" (onClick)="close(true)" variant="solid" color="theme">
            {{button1}}
        </upx-button>
        <upx-button *ngIf="!isTheme" (onClick)="close(true)">
            {{button1}}
        </upx-button>
    </upx-modal-footer>
</upx-modal>
