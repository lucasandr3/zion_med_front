<!-- Formulário novo/editar plano — full-bleed (sem card) -->
<div class="relative min-h-[300px] w-full">
  @if (showSkeleton()) {
    <zm-skeleton-card [height]="320" />
  } @else if (!listaPronta) {
  } @else {
    <div class="zm-content-enter">
      <div class="upx-form-panel">
        <form (ngSubmit)="submit()" class="flex w-full flex-col gap-4">
          @if (error) {
            <p class="text-primary m-0 text-xs">{{ error }}</p>
          }

          <div>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Chave (única, ex: core, enterprise)</mat-label><input matInput type="text" id="key" [(ngModel)]="key" name="key" maxlength="64" required pattern="[a-z0-9_-]+" placeholder="Ex: core, enterprise" [readonly]="isEdit" /></mat-form-field>
            @if (isEdit) {
              <p class="text-muted-foreground mt-1 m-0 text-xs">A chave não pode ser alterada após criação.</p>
            }
          </div>

          <div>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Nome</mat-label><input matInput type="text" id="name" [(ngModel)]="name" name="name" maxlength="128" required placeholder="Ex: Core" /></mat-form-field>
          </div>

          <div>
            <mat-form-field appearance="outline" class="w-40"><mat-label>Valor (R$/mês)</mat-label><input matInput type="text" id="value_display" placeholder="0,00" inputmode="decimal" autocomplete="off" [ngModel]="valueDisplay" (ngModelChange)="onValueInput($event)" name="value_display" (blur)="onValueBlur()" /></mat-form-field>
          </div>

          <div>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Descrição</mat-label><textarea matInput id="description" [(ngModel)]="description" name="description" rows="3" maxlength="500" placeholder="Ex: Para clínicas pequenas e médias que precisam padronizar formulários..."></textarea></mat-form-field>
          </div>

          <div>
            <mat-form-field appearance="outline" class="w-24"><mat-label>Ordem</mat-label><input matInput type="number" id="sort_order" [(ngModel)]="sortOrder" name="sort_order" min="0" placeholder="0" /></mat-form-field>
          </div>

          <mat-checkbox [(ngModel)]="isActive" name="is_active">Plano ativo (disponível para assinatura)</mat-checkbox>

          <div class="flex flex-wrap items-center gap-3 pt-2">
            <button mat-flat-button color="primary" type="submit" [disabled]="saving">
              @if (saving) {
                <mat-spinner diameter="18"></mat-spinner>
              }
              {{ saving ? 'Salvando…' : isEdit ? 'Salvar' : 'Criar plano' }}
            </button>
            <a routerLink="/plataforma/planos" mat-stroked-button class="btn-cancel">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  }
</div>
