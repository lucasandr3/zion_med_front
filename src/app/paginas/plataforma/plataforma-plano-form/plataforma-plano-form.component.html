<div class="n-form-toolbar">
  <div class="n-form-toolbar__start">
    <zm-page-back-link />
  </div>
  <div class="n-form-toolbar__end">
    <nord-button type="button" routerLink="/plataforma/planos">
      <nord-icon name="interface-close" size="s"></nord-icon>
      Cancelar
    </nord-button>
    <nord-button
      variant="primary"
      type="button"
      [attr.loading]="saving()"
      [attr.disabled]="saving()"
      (click)="submit()"
    >
      <nord-icon name="interface-checked" size="s"></nord-icon>
      {{ isEdit ? 'Salvar' : 'Criar plano' }}
    </nord-button>
  </div>
</div>

@if (showSkeleton()) {
  <zm-skeleton-card [height]="320" />
} @else if (!listaPronta()) {
} @else {
  <div class="zm-content-enter">
    <g-card class="gap-4 py-4">
      <form class="flex w-full flex-col gap-4">
        @if (error()) {
          <p class="text-primary m-0 text-xs">{{ error() }}</p>
        }

        <div>
          <label for="key" class="text-foreground mb-1 block text-xs font-medium">Chave (única, ex: core, enterprise)</label>
          <input
            type="text"
            id="key"
            [(ngModel)]="key"
            name="key" class="w-full"
            maxlength="64"
            required
            pattern="[a-z0-9_-]+"
            placeholder="Ex: core, enterprise"
            [readonly]="isEdit"
          />
          @if (isEdit) {
            <p class="text-muted-foreground mt-1 m-0 text-xs">A chave não pode ser alterada após criação.</p>
          }
        </div>

        <div>
          <label for="name" class="text-foreground mb-1 block text-xs font-medium">Nome</label>
          <input type="text" id="name" [(ngModel)]="name" name="name" class="w-full" maxlength="128" required placeholder="Ex: Core" />
        </div>

        <div>
          <label for="value_display" class="text-foreground mb-1 block text-xs font-medium">Valor (R$/mês)</label>
          <input
            type="text"
            id="value_display" class="w-40"
            placeholder="0,00"
            inputmode="decimal"
            autocomplete="off"
            [ngModel]="valueDisplay"
            (ngModelChange)="onValueInput($event)"
            name="value_display"
            (blur)="onValueBlur()"
          />
        </div>

        <div>
          <label for="description" class="text-foreground mb-1 block text-xs font-medium">Descrição</label>
          <textarea
            id="description"
            [(ngModel)]="description"
            name="description"
            rows="3" class="w-full"
            maxlength="500"
            placeholder="Ex: Para clínicas pequenas e médias que precisam padronizar formulários..."
          ></textarea>
        </div>

        <div>
          <label for="sort_order" class="text-foreground mb-1 block text-xs font-medium">Ordem de exibição</label>
          <input type="number" id="sort_order" [(ngModel)]="sortOrder" name="sort_order" class="w-24" min="0" placeholder="0" />
        </div>

        <nord-checkbox [(ngModel)]="isActive" name="is_active" label="Plano ativo (disponível para assinatura)"></nord-checkbox>
      </form>
    </g-card>
  </div>
}
