<footer class="fp-footer">
  <div class="fp-footer-inner" [class.fp-footer-inner--steps]="usesFormSteps">
    @if (usesFormSteps && !isFirstFormStep) {
      <button type="button" class="fp-step-btn fp-step-btn--back" (click)="voltarEtapa.emit()" aria-label="Voltar para etapa anterior">
        Anterior
      </button>
    }
    @if (usesFormSteps && !isLastFormStep) {
      <button type="button" class="fp-step-btn fp-step-btn--next" (click)="avancarEtapa.emit()" aria-label="Continuar para próxima etapa">
        Continuar
        <svg class="fp-submit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    } @else {
      <button
        type="submit"
        form="formulario-publico-form"
        class="fp-submit-btn"
        [class.fp-submit-btn--solo]="!usesFormSteps || isFirstFormStep"
        [disabled]="enviando"
        [attr.aria-busy]="enviando"
      >
        @if (enviando) {
          <svg class="fp-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25" />
            <path d="M21 12a9 9 0 00-9-9" />
          </svg>
          Enviando…
        } @else {
          <svg class="fp-submit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          Enviar formulário
        }
      </button>
    }
  </div>
</footer>
