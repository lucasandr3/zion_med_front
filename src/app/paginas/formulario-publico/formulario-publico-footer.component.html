<footer class="fp-footer">
  <div
    class="fp-footer-inner"
    [class.fp-footer-inner--steps]="!showIntro && (showIdentityPhase || usesFormSteps)"
  >
    @if (showIntro) {
      <button type="button" class="fp-submit-btn fp-submit-btn--solo" (click)="startForm.emit()">
        Começar preenchimento
        <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-submit-icon" aria-hidden="true">arrow_forward</span>
      </button>
    } @else if (showIdentityPhase) {
      <button type="button" class="fp-step-btn fp-step-btn--back" (click)="voltarEtapa.emit()" aria-label="Voltar para a introdução">
        <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-submit-icon" aria-hidden="true">chevron_left</span>
        <span>Voltar</span>
      </button>
      <button type="button" class="fp-step-btn fp-step-btn--next" (click)="avancarEtapa.emit()" aria-label="Continuar para o formulário">
        Continuar
        <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-submit-icon" aria-hidden="true">arrow_forward</span>
      </button>
    } @else {
      @if ((usesFormSteps && !isFirstFormStep) || (isFirstFormStep && canBackToIdentity)) {
        <button type="button" class="fp-step-btn fp-step-btn--back" (click)="voltarEtapa.emit()" aria-label="Voltar para etapa anterior">
          <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-submit-icon" aria-hidden="true">chevron_left</span>
          <span>Voltar</span>
        </button>
      }
      @if (usesFormSteps && !isLastFormStep) {
        <button type="button" class="fp-step-btn fp-step-btn--next" (click)="avancarEtapa.emit()" aria-label="Continuar para próxima etapa">
          Continuar
          <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-submit-icon" aria-hidden="true">arrow_forward</span>
        </button>
      } @else {
        <button
          type="submit"
          form="formulario-publico-form"
          class="fp-submit-btn"
          [class.fp-submit-btn--solo]="!usesFormSteps || (isFirstFormStep && !canBackToIdentity)"
          [disabled]="enviando"
          [attr.aria-busy]="enviando"
        >
          @if (enviando) {
            <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-spin" aria-hidden="true">progress_activity</span>
            Enviando…
          } @else {
            Enviar formulário
            <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-submit-icon" aria-hidden="true">check</span>
          }
        </button>
      }
    }
  </div>
</footer>
