<header class="fp-clinic-header">
  <div class="fp-brand">
    @if (logoUrl) {
      <div class="fp-logo fp-logo--img">
        <img
          [src]="logoUrl"
          [alt]="data.clinic_name ? 'Logo ' + data.clinic_name : 'Logo da clínica'"
          loading="lazy"
          (error)="logoError.emit()"
        />
      </div>
    } @else {
      <div class="fp-logo" aria-hidden="true">{{ clinicInitial }}</div>
    }
    <div class="fp-clinic-name-wrap">
      <strong class="fp-clinic-name">{{ data.clinic_name ?? 'Clínica' }}</strong>
      <span class="fp-sub">
        {{ data.template.name || 'Documento digital' }}
        @if (!hidePlatformBranding) {
          · Gestgo
        }
      </span>
    </div>
  </div>
  <div class="fp-clinic-actions">
    <button
      type="button"
      (click)="toggleLargeText.emit()"
      class="fp-icon-btn"
      [attr.aria-pressed]="largeTextMode"
      title="Aumentar o tamanho do texto"
      aria-label="Alternar texto ampliado"
    >
      <span class="fp-a11y-icon" aria-hidden="true">A+</span>
    </button>
    <button
      type="button"
      (click)="openHelp.emit()"
      class="fp-icon-btn"
      title="Preciso de ajuda"
      aria-label="Ajuda"
    >
      <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-theme-icon" aria-hidden="true">help</span>
    </button>
    <button
      type="button"
      (click)="toggleDark.emit()"
      class="fp-icon-btn"
      title="Modo claro ou escuro"
      aria-label="Alternar tema claro ou escuro"
    >
      <span class="material-symbols-outlined gestgo-mi gestgo-mi--s fp-theme-icon" aria-hidden="true">
        {{ dark ? 'light_mode' : 'dark_mode' }}
      </span>
    </button>
  </div>
</header>
