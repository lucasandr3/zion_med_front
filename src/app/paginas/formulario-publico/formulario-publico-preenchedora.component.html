<div class="fp-preenchedora">
  <div class="fp-preenchedora-grid">
    <div class="fp-field-group">
      <label for="submitterName" class="fp-field-label">Seu nome</label>
      <nord-input
        id="submitterName"
        name="submitterName"
        expand
        hide-label
        label="Seu nome"
        [value]="submitterName"
        (input)="onNameInput($event)"
        class="fp-nord-control"
        placeholder="Nome para contato"
        [attr.autocomplete]="personLinkRequired ? 'off' : 'name'"
      ></nord-input>
    </div>
    <div class="fp-field-group">
      <label for="submitterEmail" class="fp-field-label">Seu e-mail</label>
      <nord-input
        id="submitterEmail"
        name="submitterEmail"
        type="email"
        expand
        hide-label
        label="Seu e-mail"
        [value]="submitterEmail"
        (input)="onEmailInput($event)"
        class="fp-nord-control"
        placeholder="email@exemplo.com"
        [attr.autocomplete]="personLinkRequired ? 'off' : 'email'"
      ></nord-input>
    </div>
  </div>
</div>
