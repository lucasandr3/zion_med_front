<div class="n-form-toolbar">
  <div class="n-form-toolbar__start">
    <zm-page-back-link />
  </div>
  <div class="n-form-toolbar__end">
    <nord-button type="button" [routerLink]="cancelLink">
      <nord-icon name="interface-close" size="s"></nord-icon>
      Cancelar
    </nord-button>
    <nord-button
      variant="primary"
      type="button"
      [attr.loading]="salvando"
      [attr.disabled]="salvando || !pessoaForm.controls.name.value.trim()"
      (click)="salvar()"
    >
      <nord-icon name="interface-checked" size="s"></nord-icon>
      {{ editMode ? 'Salvar alterações' : 'Cadastrar' }}
    </nord-button>
  </div>
</div>

@if (showSkeleton() && editMode) {
  <zm-skeleton-pessoa-formulario />
} @else if (!listaPronta) {
} @else if (erro && editMode) {
  <p class="mb-4 text-sm text-destructive">{{ erro }}</p>
} @else {
  <div class="zm-content-enter">
    <g-card class="gap-0 py-5 shadow-sm **:data-[slot=card-content]:px-5">
      @if (erro && !editMode) {
        <p class="mb-4 text-sm text-destructive">{{ erro }}</p>
      }
      <form [formGroup]="pessoaForm" class="flex flex-col gap-5">
        <div>
          <label class="pessoa-form-label" for="pessoa-name">Nome completo *</label>
          <input
            id="pessoa-name"
            type="text"
            formControlName="name"
            class="w-full text-sm"
            placeholder="Ex.: Maria da Silva"
            autocomplete="name"
          />
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="pessoa-form-label" for="pessoa-phone">Telefone / WhatsApp</label>
            <input
              id="pessoa-phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel-national"
              class="w-full text-sm"
              [ngModel]="phoneDisplay"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="onPhoneModelChange($event)"
              placeholder="(11) 98765-4321"
            />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-phone-alt">Telefone alternativo</label>
            <input
              id="pessoa-phone-alt"
              type="tel"
              inputmode="numeric"
              autocomplete="tel-national"
              class="w-full text-sm"
              [ngModel]="phoneAltDisplay"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="onPhoneAltModelChange($event)"
              placeholder="(11) 3333-4444"
            />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="pessoa-form-label" for="pessoa-email">E-mail</label>
            <input
              id="pessoa-email"
              type="email"
              formControlName="email"
              class="w-full text-sm"
              placeholder="nome@exemplo.com"
              autocomplete="email"
            />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-profession">Profissão</label>
            <input
              id="pessoa-profession"
              type="text"
              formControlName="profession"
              class="w-full text-sm"
              placeholder="Ex.: Enfermeira"
            />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
          <div>
            <label class="pessoa-form-label" for="pessoa-birth">Data de nascimento</label>
            <input
              id="pessoa-birth"
              type="text"
              mwlFlatpickr
              [(ngModel)]="birth_date"
              [ngModelOptions]="{ standalone: true }"
              class="w-full text-sm"
              placeholder="dd/mm/aaaa"
              [altInput]="true"
              [convertModelValue]="true"
              [appendTo]="flatpickrAppendTo"
              [static]="false"
              autocomplete="bday"
            />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-age">Idade</label>
            <input
              id="pessoa-age"
              type="number"
              formControlName="age"
              class="w-full text-sm"
              min="0"
              placeholder="Ex.: 30"
            />
          </div>
          <div>
            <label class="pessoa-form-label" id="pessoa-sex-label">Sexo</label>
            <z-combobox
              class="w-full"
              zWidth="full"
              formControlName="sex"
              [options]="opcoesSexo"
              placeholder="Selecione"
              [searchable]="false"
              ariaLabel="Sexo"
              ariaDescribedBy="pessoa-sex-label"
            />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-cpf">CPF</label>
            <input
              id="pessoa-cpf"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              class="w-full text-sm"
              placeholder="000.000.000-00"
              maxlength="14"
              [ngModel]="cpfDisplay"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="onCpfModelChange($event)"
            />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-3">
          <div>
            <label class="pessoa-form-label" for="pessoa-rg">RG</label>
            <input id="pessoa-rg" type="text" formControlName="rg" class="w-full text-sm" />
          </div>
          <div>
            <label class="pessoa-form-label" id="pessoa-marital-label">Estado civil</label>
            <z-combobox
              class="w-full"
              zWidth="full"
              formControlName="marital_status"
              [options]="opcoesEstadoCivil"
              placeholder="Selecione"
              [searchable]="false"
              ariaLabel="Estado civil"
              ariaDescribedBy="pessoa-marital-label"
            />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-referred">Indicado por</label>
            <input id="pessoa-referred" type="text" formControlName="referred_by" class="w-full text-sm" />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="pessoa-form-label" for="pessoa-address">Endereço completo</label>
            <input id="pessoa-address" type="text" formControlName="address" class="w-full text-sm" />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-neighborhood">Bairro</label>
            <input id="pessoa-neighborhood" type="text" formControlName="neighborhood" class="w-full text-sm" />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="pessoa-form-label" for="pessoa-city">Cidade</label>
            <input id="pessoa-city" type="text" formControlName="city" class="w-full text-sm" />
          </div>
          <div>
            <label class="pessoa-form-label" for="pessoa-cep">CEP</label>
            <input
              id="pessoa-cep"
              type="text"
              formControlName="cep"
              class="w-full text-sm"
              placeholder="00000-000"
            />
          </div>
        </div>

        <div class="grid gap-4 border-t border-border pt-5 md:grid-cols-2">
          <div>
            <label class="pessoa-form-label">Como nos conheceu</label>
            <div class="flex flex-col gap-2.5">
              <nord-checkbox formControlName="lead_source_instagram" label="Instagram"></nord-checkbox>
              <nord-checkbox formControlName="lead_source_google" label="Google"></nord-checkbox>
              <nord-checkbox formControlName="lead_source_facebook" label="Facebook"></nord-checkbox>
              <nord-checkbox formControlName="lead_source_indicacao_amigo" label="Indicação de amigo/familiar"></nord-checkbox>
              <nord-checkbox formControlName="lead_source_indicacao_medica" label="Indicação médica"></nord-checkbox>
              <nord-checkbox formControlName="lead_source_plano_saude" label="Plano de saúde"></nord-checkbox>
            </div>
            <input
              type="text"
              formControlName="lead_source_outro"
              class="mt-3 w-full text-sm"
              placeholder="Outro"
            />
          </div>
          <div>
            <label class="pessoa-form-label" id="pessoa-health-plan-label">Plano de saúde</label>
            <z-combobox
              class="w-full"
              zWidth="full"
              formControlName="has_health_plan"
              [options]="opcoesPlanoSaude"
              placeholder="Selecione"
              [searchable]="false"
              ariaLabel="Plano de saúde"
              ariaDescribedBy="pessoa-health-plan-label"
            />
            <input
              type="text"
              formControlName="health_plan_operator"
              class="mt-3 w-full text-sm"
              placeholder="Operadora"
            />
            <input
              type="text"
              formControlName="health_plan_card_number"
              class="mt-3 w-full text-sm"
              placeholder="Número da carteirinha"
            />
          </div>
        </div>

        <div class="border-t border-border pt-5">
          <label class="pessoa-form-label">Autorizações LGPD</label>
          <div class="pessoa-form-lgpd flex flex-col gap-2.5">
            <nord-checkbox formControlName="lgpd_accept_comms" label="Aceito receber comunicações e promoções por WhatsApp/e-mail"></nord-checkbox>
            <nord-checkbox formControlName="lgpd_accept_reminders" label="Aceito receber lembretes de consulta"></nord-checkbox>
          </div>
        </div>

        @if (editMode) {
          <div>
            <label class="pessoa-form-label" id="pessoa-status-label">Situação</label>
            <z-combobox
              class="w-full max-w-xs"
              zWidth="full"
              formControlName="status"
              [options]="opcoesStatus"
              [searchable]="false"
              ariaLabel="Situação"
              ariaDescribedBy="pessoa-status-label"
            />
          </div>
        }

        <div>
          <label class="pessoa-form-label" for="pessoa-notes">Observações</label>
          <textarea
            id="pessoa-notes"
            formControlName="notes"
            rows="3"
            class="w-full text-sm"
            placeholder="Anotações internas (opcional)"
          ></textarea>
        </div>
      </form>
    </g-card>
  </div>
}
