<section class="lb-hero lb-card">
  <div class="lb-hero__main">
    <div class="lb-hero__eyebrow">
      Link na bio
      <span class="lb-badge">Publicado</span>
    </div>
    <h1 class="lb-hero__title">{{ clinicName }}</h1>
    <div class="lb-hero__linkrow">
      <div class="lb-hero__url" [attr.title]="publicUrl">
        <span class="material-symbols-outlined gestgo-mi gestgo-mi--s" aria-hidden="true">link</span>
        <span class="lb-hero__url-text">{{ displayUrl }}</span>
      </div>
      <nord-button type="button" variant="default" size="m" (click)="copyLink.emit()">
        <span class="material-symbols-outlined gestgo-mi gestgo-mi--s" aria-hidden="true">
          {{ copiedLink ? 'check' : 'content_copy' }}
        </span>
        {{ copiedLink ? 'Copiado' : 'Copiar' }}
      </nord-button>
      <nord-button
        variant="primary"
        size="m"
        [href]="publicUrlAbrir"
        target="_blank"
        rel="noopener"
      >
        Abrir página
        <span slot="end" class="material-symbols-outlined gestgo-mi gestgo-mi--s" aria-hidden="true">open_in_new</span>
      </nord-button>
    </div>
    @if (visitasHoje !== null || cliques !== null) {
      <p class="lb-hero__sub">
        <b>{{ visitasHoje ?? 0 }} visitas</b> hoje · <b>{{ cliques ?? 0 }} cliques</b>
      </p>
    }
  </div>
  <div class="lb-hero__phone" aria-hidden="true">
    <div class="lb-hero__phone-av"></div>
    <div class="lb-hero__phone-ln"></div>
    <div class="lb-hero__phone-pill"></div>
    <div class="lb-hero__phone-pill"></div>
    <div class="lb-hero__phone-pill"></div>
  </div>
</section>
