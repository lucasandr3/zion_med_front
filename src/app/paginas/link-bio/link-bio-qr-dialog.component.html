@if (open) {
  <div class="link-bio-qr-backdrop" role="presentation" (click)="fechar()"></div>
  <div
    class="link-bio-qr-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'QR code — ' + (clinicName || 'link na bio')"
  >
    <div class="link-bio-qr-dialog__head">
      <div class="min-w-0">
        <p class="link-bio-qr-dialog__title">{{ clinicName }}</p>
        <p class="link-bio-qr-dialog__sub">Escaneie para abrir a página pública</p>
      </div>
      <button
        mat-icon-button
        type="button"
        class="shrink-0"
        aria-label="Fechar"
        (click)="fechar()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="link-bio-qr-dialog__body">
      @if (qrCarregando) {
        <z-skeleton class="link-bio-qr-dialog__skeleton" />
      } @else if (qrDataUrl) {
        <img [src]="qrDataUrl" alt="" class="link-bio-qr-dialog__img" />
      }
    </div>
    <div class="link-bio-qr-dialog__actions">
      <button
        mat-stroked-button
        class="btn-cancel gap-2"
        type="button"
        [disabled]="!qrDataUrl"
        (click)="baixar()"
      >
        <mat-icon>download</mat-icon>
        Baixar QR code
      </button>
    </div>
  </div>
}
