<div class="link-bio-side-preview-col flex flex-col items-center min-w-0 self-start w-full max-lg:max-w-[360px] max-lg:mx-auto">
  <div class="link-bio-phone link-bio-phone--side w-full max-w-[320px] lg:max-w-none">
    @if (previewUrlSafe()) {
      <iframe
        [src]="previewUrlSafe()"
        title="Preview do link na bio"
        class="link-bio-phone-screen w-full h-full border-0"
        loading="lazy"
      ></iframe>
    } @else {
      <div
        class="link-bio-phone-screen w-full h-full min-h-[400px] flex flex-col items-center justify-center rounded-xl text-sm"
        style="background:var(--c-soft);color:var(--c-muted);border:1px dashed var(--c-border)"
      >
        <span class="material-symbols-outlined mb-2" style="font-size:32px">smartphone</span>
        <span>{{ loadingLabel() }}</span>
      </div>
    }
  </div>
</div>
