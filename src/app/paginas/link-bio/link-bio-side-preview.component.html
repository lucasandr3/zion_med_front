<div class="link-bio-side-preview-col">
  <div class="link-bio-phone">
    @if (previewUrlSafe()) {
      <iframe
        [src]="previewUrlSafe()"
        title="Preview do link na bio"
        class="link-bio-phone-screen"
        loading="lazy"
      ></iframe>
    } @else {
      <div
        class="link-bio-phone-screen flex flex-col items-center justify-center rounded-xl text-sm"
        style="background:var(--c-soft);color:var(--c-muted);border:1px dashed var(--c-border)"
      >
        <span class="material-symbols-outlined mb-2" style="font-size:32px">smartphone</span>
        <span>{{ loadingLabel() }}</span>
      </div>
    }
  </div>
</div>
