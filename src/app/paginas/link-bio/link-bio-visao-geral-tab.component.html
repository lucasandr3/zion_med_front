<div class="lb-wrap link-bio-fade-in">
  <zm-link-bio-overview-header
    [clinicName]="state.clinic.name"
    [publicUrl]="publicUrl"
    [publicUrlAbrir]="publicUrlAbrirNoNavegador"
    [totemUrl]="totemUrl"
    [totemUrlAbrir]="totemUrlAbrirNoNavegador"
    [copiedLink]="copiedPrincipalLink"
    [copiedTotem]="copiedTotemLink"
    [visitasHoje]="state.metrics.visitas_hoje"
    [cliques]="state.metrics.total_clicks_last_30"
    (copyLink)="copiarLinkPrincipal()"
    (copyTotem)="copiarLinkTotem()"
  />

  @if (state.metrics) {
    <zm-link-bio-overview-section
      [metrics]="state.metrics"
      [stats]="state.stats"
      [clinic]="state.clinic"
      [links]="state.links"
      [forms]="state.forms"
      [layoutModel]="layoutModel"
      [statsPeriodo]="statsPeriodo"
      [ctrMediaSetor]="ctrMediaSetor"
      (statsPeriodoChange)="selecionarPeriodoStats($event)"
      (applySuggestion)="applySuggestion.emit($event)"
    />
  }
</div>
