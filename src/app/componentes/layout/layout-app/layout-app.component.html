<app-barra-lateral [notificacoesNaoLidas]="notificacoesNaoLidas" [novidadesNaoVistas]="novidadesNaoVistas" [trialNotice]="trialNotice" />
<div class="main-wrapper flex flex-col min-h-screen bg-background">
  <app-cabecalho [titulo]="tituloPagina" [notificacoesNaoLidas]="notificacoesNaoLidas" [novidadesNaoVistas]="novidadesNaoVistas" shellContext="app" />
  @if (trialNotice) {
    <div
      class="trial-banner px-4 sm:px-6 lg:px-8 py-3 text-sm flex flex-wrap items-center justify-between gap-3 border-b bg-muted/35 text-foreground border-border"
      role="status"
    >
      <span class="flex items-center gap-2 text-muted-foreground">
        <span class="material-symbols-outlined text-lg text-primary" aria-hidden="true">schedule</span>
        {{ trialNotice.message }}
      </span>
      <a routerLink="/assinatura" z-button zType="link" class="shrink-0 font-semibold">Ver assinatura</a>
    </div>
  }
  @if (mostrarAvisoCobrancaGlobal()) {
    <div class="px-4 sm:px-6 lg:px-8 pt-3">
      <zm-assinatura-bloqueada-card variant="compact" />
    </div>
  }
  <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 lg:py-6 bg-background">
    @if (urlVoltar && !voltarIntegrado) {
      <div class="zm-page-back-bar mb-4">
        <zm-page-back-link [url]="urlVoltar" [label]="labelVoltar" />
      </div>
    }
    <router-outlet />
  </main>
</div>
<go-assistant-host />
