<div class="gm-backrow">
  <a class="gm-icon-btn" routerLink="/m/ferramentas" aria-label="Voltar">
    <span class="material-symbols-outlined gestgo-mi gestgo-mi--s" aria-hidden="true">arrow_back</span>
  </a>
  <div>
    <h1>Taxas de cartão</h1>
    <small>Simulador no servidor</small>
  </div>
</div>

<div class="gm-panel">
  <div class="gm-field">
    <label>Valor cobrado (R$)</label>
    <input type="number" min="0" step="0.01" [(ngModel)]="amount" />
  </div>
  <div class="gm-field">
    <label>Parcelas</label>
    <div class="gm-seg">
      @for (n of [1, 3, 6, 12]; track n) {
        <button type="button" [class.is-on]="installments === n" (click)="setInstallments(n)">{{ n }}x</button>
      }
    </div>
  </div>
  <div class="gm-field">
    <label>Taxa total (%)</label>
    <input type="number" min="0" max="99" step="0.1" [(ngModel)]="fee" />
  </div>
  <button type="button" class="gm-btn" (click)="calcular()" [disabled]="loading()">
    {{ loading() ? 'Calculando…' : 'Simular recebimento' }}
  </button>
</div>

@if (result(); as r) {
  <div class="gm-result">
    <span class="gm-result__label">Você recebe</span>
    <strong>{{ money(r.net) }}</strong>
    <small>Taxa estimada: {{ money(r.fee) }} · {{ r.installments }} parcela(s)</small>
  </div>
}
<p class="gm-hint">Use a taxa real da sua maquininha. Não inclui antecipação.</p>
