<div class="gm-backrow">
  <a class="gm-icon-btn" routerLink="/m/ferramentas" aria-label="Voltar">
    <span class="material-symbols-outlined gestgo-mi gestgo-mi--s" aria-hidden="true">arrow_back</span>
  </a>
  <div>
    <h1>Retornos</h1>
    <small>Persistido na clínica</small>
  </div>
</div>

<div class="gm-panel">
  <div class="gm-field">
    <label>Nome</label>
    <input type="text" [(ngModel)]="clientName" />
  </div>
  <div class="gm-field">
    <label>Detalhe</label>
    <input type="text" [(ngModel)]="detail" placeholder="Follow-up após atendimento" />
  </div>
  <button type="button" class="gm-btn" (click)="criar()">Adicionar retorno</button>
</div>

@if (loading()) {
  <p class="gm-loading">Carregando…</p>
} @else if (items().length === 0) {
  <p class="gm-empty">Nenhum retorno pendente.</p>
} @else {
  @for (item of items(); track item.id) {
    <div class="gm-panel">
      <div class="gm-packrow">
        <b style="font-size:13px">{{ item.client_name }}</b>
        <span class="gm-status" [class.ok]="item.status === 'contacted'">
          {{ item.status === 'contacted' ? 'Contatado' : 'Pendente' }}
        </span>
      </div>
      <p style="margin:8px 0 14px;font-size:12px;color:#758096">{{ item.detail }}</p>
      <div class="gm-actions">
        <button type="button" class="gm-btn gm-btn--secondary" (click)="whatsapp(item)">Mensagem</button>
        <button type="button" class="gm-btn gm-btn--soft" (click)="toggle(item.id)">
          {{ item.status === 'contacted' ? 'Desfazer' : 'Contatado' }}
        </button>
      </div>
    </div>
  }
}
