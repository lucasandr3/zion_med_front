<body class="theme-ocean-blue" style="background-color: var(--c-bg); color: var(--c-text)">
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('gestgo_theme') || 'ocean-blue';
        if (theme === 'zion-blue') theme = 'gestgo-blue';
        Array.from(document.body.classList).filter(function(c){ return c.startsWith('theme-'); }).forEach(function(c){ document.body.classList.remove(c); });
        document.body.classList.add('theme-' + theme);
        if (localStorage.getItem('gestgo_dark_mode') === '1') document.body.classList.add('dark');
        if (localStorage.getItem('gestgo_sidebar_collapsed') === '1') document.body.classList.add('sidebar-collapsed');
        var shell = localStorage.getItem('gestgo_shell_preset') || 'default';
        if (shell === 'tinted') document.body.classList.add('shell-preset-tinted');
        else if (shell === 'sidebar_dark') document.body.classList.add('shell-preset-sidebar-dark');
        var nav = localStorage.getItem('gestgo_nav_layout') || 'sidebar';
        if (nav === 'horizontal') document.body.classList.add('shell-nav-horizontal');

        /* Accent Nord + favicon + theme-color no boot (antes do Angular/CSS) */
        var themeColors = {
          'gestgo-blue': '#1e40af', 'ocean-blue': '#14B87A', 'indigo-night': '#3730a3',
          'emerald-fresh': '#15803d', 'rose-elegant': '#be185d', 'amber-warm': '#b45309',
          'violet-dream': '#6d28d9', 'teal-ocean': '#0f766e', 'slate-pro': '#334155',
          'cyan-tech': '#0369a1', 'fuchsia-bold': '#a21caf'
        };
        var logoFiles = {
          'gestgo-blue': 'logo-azul.png', 'ocean-blue': 'logo.png', 'indigo-night': 'logo-indigo.png',
          'emerald-fresh': 'logo-emerald.png', 'rose-elegant': 'logo-rose.png', 'amber-warm': 'logo-amber.png',
          'violet-dream': 'logo-violet.png', 'teal-ocean': 'logo-teal.png', 'slate-pro': 'logo-slate.png',
          'cyan-tech': 'logo-cyan.png', 'fuchsia-bold': 'logo-fucshia.png'
        };
        var primary = themeColors[theme] || getComputedStyle(document.body).getPropertyValue('--c-primary').trim() || '#14B87A';
        var root = document.documentElement;
        root.style.setProperty('--n-color-accent', primary);
        root.style.setProperty('--n-color-accent-secondary', primary);
        root.style.setProperty('--n-color-text-link', primary);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', document.body.classList.contains('dark') ? '#1d2025' : primary);
        var favHref = '/assets/logo/' + (logoFiles[theme] || 'logo.png') + '?theme=' + encodeURIComponent(theme);
        document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]').forEach(function(el){ el.remove(); });
        var fav = document.createElement('link');
        fav.rel = 'icon';
        fav.type = 'image/png';
        fav.setAttribute('data-theme-favicon', '1');
        fav.href = favHref;
        document.head.prepend(fav);
      } catch(e) {}
    })();
  </script>
